<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Manager - Dashboard</title>
        
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        
        <style type="text/tailwindcss">
            @theme {
                --color-brand-beige: #E8D6C3;
                --color-brand-brown: #6B4F3A;
                --color-brand-gold: #C9A15B;
                --color-brand-gold-dark: #916823;
                --color-brand-link-blue: #1A56DB;
                --color-brand-link-blue-hover: #11459E;
            }
        </style>
    </head>
    <body class="bg-brand-beige min-h-screen">
        
        <header class="bg-brand-brown text-brand-beige shadow-lg">
            <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
                    <h1 class="text-2xl font-bold">
                        Contact Manager
                    </h1>            
                    <button onclick="handleLogout()" class="bg-brand-gold text-brand-brown px-4 py-2 rounded-xl font-semibold">
                        Logout
                    </button>
            </div>
        </header>
        
        <main class="max-w-6xl mx-auto p-6">
           
            <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
                
                <h2 id="welcome-message" class="text-2xl font-bold text-brand-brown"></h2>    
                
                
                <p class="text-brand-brown mt-2 mb-3">
                    Type a name to search or add new contact:
                </p>

                <div class="flex gap-3">
                    
                    <input 
                        type="text"
                        placeholder="Search contacts..."
                        class="flex-1 border border-brand-beige rounded-xl px-4 py-3">
                    
                    <button class="bg-brand-brown text-brand-beige px-5 py-3 rounded-xl font-semibold">
                        Search
                    </button>

                     <button 
                        onclick="openContact()"
                        class="bg-brand-gold text-brand-brown px-4 py-3 rounded-xl font-bold">
                        + Add Contact    
                    </button>
                </div>
                
            
            </div>

            <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
                <table class="w-full">
                    
                    <thead class="bg-brand-brown text-brand-beige">
                        <tr>
                            <th class="text-left p-4">First Name</th>
                            <th class="text-left p-4">Last Name</th>
                            <th class="text-left p-4">Phone</th>
                            <th class="text-left p-4">Email</th>
                            <th class="text-left p-4">Actions</th>
                        
                        </tr>
                    </thead>

                    <tbody id="contacts-table-body">
                        <tr class="border-b border-brand-beige">
                            <td class="p-4">John</td>

                            <td class="p-4">Smith</td>

                            <td class="p-4">407-555-1234</td>

                            <td class="p-4">john@email.com</td>

                            <td class="p-4">
                                <button 
                                    onclick="editContact()" 
                                    class="bg-brand-gold text-brand-brown px-3 py-1 rounded-lg mr-2">
                                    
                                    Edit
                                </button>
                                <button class="bg-red-500 text-white px-3 py-1 rounded-lg">
                                    Delete
                                </button>
                            </td>
                            
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <div id="contact-card" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
            
            <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-md">

                <h2 id="title-card" class="text-2xl text-center font-bold text-brand-brown mb-3">Card</h2>    
                <p class="text-brand-brown text-center mt-2 mb-3">
                    All fields are required.
                </p>

                <form class="space-y-4">
                    
                    <label for="first-name" class="font-bold text-brand-brown">
                        First Name
                        <span class="text-red-700">*</span>
                    </label> 

                    <input
                        id="first-name"
                        type="text"
                        placeholder="FirstName"
                        required
                        class="w-full border border-brand-beige rounded-xl px-4 py-3">
                    
                    <label for="last-name" class="font-bold text-brand-brown">
                        Last Name
                        <span class="text-red-700">*</span>
                    </label> 
                    
                    <input
                        id="last-name"
                        type="text"
                        placeholder="LastName"
                        required
                        class="w-full border border-brand-beige rounded-xl px-4 py-3">
                    
                    <label for="email" class="font-bold text-brand-brown">
                        Email
                        <span class="text-red-700">*</span>
                    </label> 
                    
                    <input
                        id="email"
                        type="email"
                        placeholder="email@example.com"
                        required
                        class="w-full border border-brand-beige rounded-xl px-4 py-3">
                    
                    <label for="phone" class="font-bold text-brand-brown">
                        Phone
                        <span class="text-red-700">*</span>
                    </label> 

                    <input
                        id="phone"
                        type="tel"
                        placeholder="000-000-0000"
                        required
                        class="w-full border border-brand-beige rounded-xl px-4 py-3">
                    
                    <div class="flex justify-end gap-3">
                        
                        <button
                            type="button"
                            onclick="closeContact()"
                            class="px-4 py-2 rounded-xl border">
                            
                            Cancel
                            
                        </button>

                        <button
                            type="submit"
                            class="bg-brand-brown text-brand-beige px-4 py-2 rounded-xl">
                            
                            Save
                            
                        </button>

                    </div>
                    
                </form>

            </div>

        </div>

        <script>

            //const AUTH_URL = "http://192.241.134.241/api/auth.php";
            //const CONTACT_URL = "http://192.241.134.241/api/contacts.php";

            function openContact() {
                document.getElementById("contact-card").classList.remove("hidden");
                document.getElementById("title-card").innerText = "Add Contact";

                // clean fields, just in case user clicks on Edit and then Add Contact
                
                document.getElementById("first-name").value = "";
                document.getElementById("last-name").value = "";
                document.getElementById("email").value = "";
                document.getElementById("phone").value = "";
            }

            function closeContact() {
                document.getElementById("contact-card").classList.add("hidden");
            }

            function editContact() {
                document.getElementById("contact-card").classList.remove("hidden");
                document.getElementById("title-card").innerText = "Edit Contact";
                
                // TODO: get correct data using API

                document.getElementById("first-name").value = "John"; //contact.first_name
                document.getElementById("last-name").value = "Smith";
                document.getElementById("email").value = "407-555-1234";
                document.getElementById("phone").value = "john@email.com";
            }

            function handleLogout() {
                alert("Logging out...");
                window.location.href = "index.html";
            }
        </script>

    </body>
</html>
